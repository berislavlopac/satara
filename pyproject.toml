[project]
name = "satara"
version = "0.2.0"
description = "A service that packs uploaded files into a ZIP archive."
readme = "README.md"
authors = [
    { name = "Berislav Lopac", email = "berislav@lopac.net" }
]
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.9.2",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "unclogger>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "prek>=0.5.4",
    "pyrefly>=1.3.2",
    "ruff>=0.16.9",
    "rust-just>=1.58.0",
    "types-aiobotocore[s3,sqs]>=3.9.2",
]
docs = [
    "mkdocs-materialx>=10.2.0",
]
test = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.3",
    "moto[server]>=5.2.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-spec>=6.1.0",
]

[tool.uv]
package = false
default-groups = [
    "dev",
    "test",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests need a live service and run separately; they are not measured, because
# the coverage floor is the unit suite's to hold.
testpaths = ["tests/unit"]
markers = [
    "integration: runs against a live external service (e.g. the local compose stack); not part of the unit suite.",
]

[tool.coverage.run]
source = ["satara/"]

[tool.coverage.report]
skip_covered = true
show_missing = true
skip_empty = true
fail_under = 85
exclude_also = ["pragma: no cover", "@abstract"]

[tool.pyrefly]
# The package, its scripts and the test doubles. Tests themselves are not type-checked: they prove
# themselves by running, and annotating them invites a fight with every double and mock. The
# doubles are checked so that they cannot drift from the protocols they stand in for.
project-includes = ["satara/**/*.py", "scripts/**/*.py", "tests/unit/fakes.py"]

[tool.ruff]
line-length = 96
output-format = "grouped"

[tool.ruff.lint]
select = [  # see https://docs.astral.sh/ruff/rules/
    "E4", "E7", "E9",  # basic pycodestyle rules
    "W",        # pycodestyle warnings
    "F",        # Pyflakes rules
    "C90",      # McCabe complexity
    "N",        # PEP8 naming conventions
    "I",        # import statements linting and formatting
    "PLR",      # Pylint refactoring recommendations
    "PTH",      # recommends to use pathlib instead of os.path
    "UP",       # pyupgrade suggestions
    "BLE",      # locates blind exception capture
    "B",        # locates possible bugs and design problems
    "A",        # locates shadowing of builtin names
    "C4",       # locates possible issues with comprehensions
    "DTZ",      # locates incorrect use of timezone information; every datetime inside is UTC
    "PIE",      # miscellaneous linting rules
    "TRY",      # locates potential exception handling antipatterns
    "PERF",     # locates potential performance issues
    "RUF",      # various Ruff-specific linting rules
    "S",        # various insecure code, with bandit
    "ERA",      # eradicate: commented-out code
    "ANN",      # missing type annotations
]
ignore = [
    "TRY003",  # a raise site can add context the exception class cannot anticipate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR0913",  # unlimited function arguments
    "S101",     # allow asserts
    "S105",     # allow hardcoded passwords
    "N802",     # allow variable case in test names
    "PLR2004",  # allow magic values in comparisons
    "S311",     # allow random generator
]
# Tests are not type-checked; the test doubles in `fakes.py` are, so they keep the rule.
"tests/**/{test_*,conftest}.py" = ["ANN"]

[tool.ruff.lint.isort]
# see https://docs.astral.sh/ruff/settings/#lintisort
known-first-party = ["satara"]
combine-as-imports = true

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
# see https://docs.astral.sh/ruff/settings/#format
docstring-code-format = false

[tool.deptry.per_rule_ignores]
# Used without being imported: the form parser loads one, and the other is the server.
DEP002 = ["python-multipart", "uvicorn"]
