# The deferred flow, run locally: the API, the queue consumer, and an S3 and SQS emulator that
# creates the bucket and the queues when it starts. The credentials are the emulator's
# placeholders.

x-aws: &aws
  AWS_ENDPOINT_URL: http://storage:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

services:
  storage:
    image: ministackorg/ministack:1.5.22
    ports:
      - "4566:4566"
    environment:
      BUCKET: satara-archive-deferred-flow-storage
      QUEUE: satara-uploads
    # The emulator runs the scripts in its ready directory once it accepts requests.
    volumes:
      - ./scripts/storage-setup.sh:/etc/localstack/init/ready.d/storage-setup.sh:ro
    # Healthy once the setup has run without failing. The emulator reports itself ready even
    # when a script fails, but counts the failures, so the check exits with that count.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request as request;
          ready = request.urlopen("http://localhost:4566/_ministack/ready");
          raise SystemExit(json.load(ready)["failed"])
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      storage:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      <<: *aws
      SATARA_DEFERRED_ENABLED: "true"
      # Presigned URLs must name the address a client on the host reaches storage by.
      SATARA_STORAGE_PUBLIC_URL: http://localhost:4566

  consumer:
    build: .
    command: ["python", "scripts/consumer.py"]
    depends_on:
      storage:
        condition: service_healthy
    environment:
      <<: *aws
    restart: unless-stopped
    # Replaces the image's HTTP check: the consumer serves nothing, and instead touches a
    # heartbeat file every 15 seconds.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib, sys, tempfile, time;
          beat = pathlib.Path(tempfile.gettempdir(), "satara-consumer-alive");
          sys.exit(time.time() - beat.stat().st_mtime > 60)
      interval: 30s
      timeout: 3s
      start_period: 10s
