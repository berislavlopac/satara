site_name: Satara Archiver
site_description: A service that packs uploaded files into a ZIP archive.
site_author: Berislav Lopac <berislav@lopac.net>
repo_url: https://github.com/berislavlopac/satara
# Plain file links, so the built site also works opened straight from disk.
use_directory_urls: false

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

theme:
  name: materialx
  icon:
    logo: material/archive-arrow-down
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    # Follows the system colour scheme until a reader picks one.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  # Fences marked `mermaid` are drawn as diagrams by the theme.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - API: api.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - CI and quality checks: ci.md
  - Architecture: architecture.md
