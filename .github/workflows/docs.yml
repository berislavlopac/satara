name: Docs

# Builds the documentation site on every change that could affect it, treating every warning as
# an error: a broken link, or a page missing from the navigation, fails the build rather than
# leaving the site quietly wrong. The site is only built, not published.
on:
  pull_request:
    branches: [main]
    paths: &docs-paths
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *docs-paths

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # The default groups bring in just; the docs group brings in the site generator.
      - name: Install the dependencies
        run: uv sync --locked --group docs

      - name: Build the site
        run: uv run just build-docs
