name: Integration tests

# Runs the integration tests against the whole local stack, when something they exercise
# changes: the code, the scripts, the image, the stack, the dependencies, the recipes, or the
# tests and this workflow themselves.
on:
  pull_request:
    branches: [main]
    paths: &paths
      - "satara/**"
      - "scripts/**"
      - "tests/integration/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths: *paths

# A new push to a pull request cancels the run still going for it; runs on main all finish.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to a commit, since a tag can be moved to other code.
jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --locked --all-groups

      # The same stack as on a developer's machine: the emulator, which sets up the bucket
      # and the queues as it starts, the API and the consumer. `--wait` returns once all are
      # healthy.
      - name: Start the Compose stack
        run: docker compose up -d --build --wait

      - name: Run the integration tests
        run: uv run just test-integration

      - name: Show the stack's logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
