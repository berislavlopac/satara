name: CI

# Checks every pull request to main and every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request cancels the run still going for it; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to a commit, since a tag can be moved to other code.
jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # `--locked` fails if the lock file is out of step with pyproject.toml.
      - name: Install the dependencies
        run: uv sync --locked --all-groups

      # The GitHub output format annotates each error on its line in the pull request.
      - name: Lint
        env:
          RUFF_OUTPUT_FORMAT: github
        run: uv run just lint

      - name: Type check
        env:
          PYREFLY_OUTPUT_FORMAT: github
        run: uv run just type

      - name: Test, with the coverage floor
        run: uv run just test-cov

      - name: Report coverage
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t satara .

      - name: Start the container and wait until it is healthy
        run: |
          docker run -d --name satara -p 8000:8000 satara
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' satara)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs satara
          exit 1

      # Proves the image serves requests, not only that it builds and answers its health check.
      - name: Archive an upload
        run: |
          printf 'hello\n' > hello.txt
          curl --fail --silent --show-error --output archive.zip \
            --form files=@hello.txt --form name=smoke \
            http://127.0.0.1:8000/archive-files
          unzip -l archive.zip | grep -q ' hello.txt$'
